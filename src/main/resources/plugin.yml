name: YudreamMinecraftServer
main: online.yudream.minecraft.bukkit.YudreamMinecraftPlugin
version: ${project.version}
api-version: 1.13
author: YuDream
description: Reports Bukkit player join, quit and AFK activity to YuDream Admin.

commands:
  yudreammc:
    description: Manage YuDream Minecraft server bridge.
    usage: /<command> <reload|status|sync|queue|help>
    aliases: [ymc]
    permission: yudreammc.admin

permissions:
  yudreammc.admin:
    description: Allows managing the YuDream Minecraft bridge.
    default: op
